[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csurv"
version = "0.1.0"
description = "Customer lifetime value prediction using mixture cure survival models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
     "ipykernel>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "matplotlib>=3.7",
]

[project.scripts]
csurv = "csurv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]